services:
  - type: web
    name: ai-scribe-notes-manager
    runtime: node
    plan: free
    branch: staging
    autoDeploy: true
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build && pnpm --filter web build
    startCommand: pnpm migration:run && node dist/main.js
    healthCheckPath: /api/v1/health/db
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: AI_TRANSCRIPTION_PROVIDER
        value: gemini
      - key: DATABASE_URL
        fromDatabase:
          name: ai-scribe-db
          property: connectionString
      - key: API_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: ai-scribe-db
    databaseName: scribe_notes_manager
    plan: free