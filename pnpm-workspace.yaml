packages:
  - web

allowBuilds:
  '@google/genai': true
  '@nestjs/core': true
  '@parcel/watcher': true
  '@scarf/scarf': true
  '@swc/core': true
  bcrypt: true
  esbuild: true
  protobufjs: true
  sqlite3: true
  unrs-resolver: true

minimumReleaseAge: 1440

onlyBuiltDependencies:
  - '@nestjs/core'
  - '@scarf/scarf'
  - '@swc/core'
  - bcrypt
  - esbuild
  - unrs-resolver
